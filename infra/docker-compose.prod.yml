services:

  # ── Infraestructura ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Aplicaciones ────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [internal]
    # Expuesto directamente — sin dominio ni SSL aún
    # Cuando haya dominio: quitar ports y usar nginx
    ports:
      - "3000:3000"

  catalog:
    build:
      context: ..
      dockerfile: apps/catalog/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    networks: [internal]
    ports:
      - "3001:3001"

  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
    networks: [internal]
    ports:
      - "3002:3002"

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  # DESACTIVADO hasta tener dominio + SSL.
  # Para activar: quitar los `ports` de los servicios arriba,
  # descomentar nginx y certbot, y actualizar nginx.conf con el dominio real.
  #
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - certbot_www:/var/www/certbot:ro
  #     - certbot_certs:/etc/letsencrypt:ro
  #   depends_on: [api, catalog, panel]
  #   networks: [internal]
  #
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   profiles: [certbot]

# ── Redes y volúmenes ──────────────────────────────────────────────────────────

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
