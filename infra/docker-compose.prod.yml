services:

  # ── Infraestructura ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Aplicaciones ────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [internal]
    # Corre migraciones al arrancar y luego la app
    command: >
      sh -c "
        node -e \"
          const { execSync } = require('child_process');
          execSync('npx prisma migrate deploy', {
            cwd: '/app',
            env: { ...process.env },
            stdio: 'inherit'
          });
        \" &&
        node dist/index.js
      "

  catalog:
    build:
      context: ..
      dockerfile: apps/catalog/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    networks: [internal]

  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
    networks: [internal]

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on: [api, catalog, panel]
    networks: [internal]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles: [certbot]  # solo se usa al renovar: docker compose --profile certbot run certbot

# ── Redes y volúmenes ──────────────────────────────────────────────────────────

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:
