version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: colacero_pg
    environment:
      POSTGRES_USER: colacero
      POSTGRES_PASSWORD: colacero_dev
      POSTGRES_DB: colacero_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colacero -d colacero_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: colacero_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
