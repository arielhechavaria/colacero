events {
  worker_connections 1024;
}

http {
  # ── Seguridad básica ────────────────────────────────────────────────────────
  server_tokens off;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # ── Gzip ───────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ── Rate limiting ──────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

  # ── Redirigir HTTP → HTTPS ─────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Certbot challenge (renovación SSL)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Catálogo público (dominio raíz) ────────────────────────────────────────
  # REEMPLAZAR: tudominio.com con el dominio real
  server {
    listen 443 ssl;
    server_name tudominio.com www.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API — prefijo /api
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://api:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Uploads (archivos estáticos servidos por la API)
    location /uploads/ {
      proxy_pass http://api:3000/uploads/;
    }

    # Catálogo Next.js
    location / {
      proxy_pass         http://catalog:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── Panel del dueño (subdominio panel.) ────────────────────────────────────
  # REEMPLAZAR: panel.tudominio.com con el subdominio real
  server {
    listen 443 ssl;
    server_name panel.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass         http://panel:3002;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
