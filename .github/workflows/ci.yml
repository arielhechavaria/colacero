name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colacero
          POSTGRES_PASSWORD: colacero_dev
          POSTGRES_DB: colacero_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for CI
        run: |
          cat > .env << 'ENVEOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://colacero:colacero_dev@localhost:5432/colacero_dev
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=ci-jwt-secret-minimum-32-characters!!
          JWT_EXPIRES_IN=7d
          OTP_TTL_SECONDS=600
          WHATSAPP_PROVIDER=mock
          API_PORT=3000
          API_HOST=0.0.0.0
          UPLOAD_DIR=/tmp/colacero-uploads
          API_PUBLIC_URL=http://localhost:3000
          CATALOG_API_URL=http://localhost:3000
          ENVEOF

      - name: Generate Prisma client
        run: pnpm --filter @colacero/db run generate

      - name: Run database migrations
        run: pnpm --filter @colacero/db run migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @colacero/api run test

      - name: Test catalog
        run: pnpm --filter @colacero/catalog run test
