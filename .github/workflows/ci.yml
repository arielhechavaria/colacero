name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     colacero
          POSTGRES_PASSWORD: colacero_test
          POSTGRES_DB:       colacero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://colacero:colacero_test@localhost:5432/colacero_test
      REDIS_URL:    redis://localhost:6379
      JWT_SECRET:   ci-secret-de-prueba-minimo-32-caracteres-ok
      NODE_ENV:     test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prisma validate
        run: pnpm --filter @colacero/db exec prisma validate

      - name: Prisma migrate (test DB)
        run: pnpm --filter @colacero/db exec prisma migrate deploy

      - name: Unit tests (env)
        run: pnpm --filter @colacero/env test
